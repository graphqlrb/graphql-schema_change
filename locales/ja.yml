---
ROOT_OPERATION_TYPE_ADDED: 新しい種類の Operation を使えるようになります。
ROOT_OPERATION_TYPE_REMOVED: この種類の Operation は実行できなくなります。
ROOT_OPERATION_TYPE_CHANGED: ルート型が変わり、選択・型条件・__typename に影響することがあります。
TYPE_ADDED: 型の追加は既存の利用に影響しません。
TYPE_REMOVED: この型を参照する Operation が無効になることがあります。
TYPE_KIND_CHANGED: 型の種類が変わり、選択できるフィールドや値の形が変わります。
SCALAR_SPECIFIED_BY_CHANGED: スカラーの値の書式についての約束が変わります。
FIELD_ADDED: フィールドの追加は既存の選択に影響しません。
FIELD_REMOVED: このフィールドを選択する Operation が無効になります。
FIELD_TYPE_CHANGED: 戻り値の型が変わり、選択できるフィールドや値の形が変わります。
IMPLEMENTED_INTERFACE_ADDED: このインターフェースが新しい型の値を返します。具象型で分岐するコードに影響することがあります。
IMPLEMENTED_INTERFACE_REMOVED: このインターフェースが対象の型を返さなくなり、Fragment の展開や応答に影響することがあります。
ARGUMENT_ADDED: 省略可能な引数の追加は既存のリクエストに影響しません。
ARGUMENT_REMOVED: この引数を指定する Operation が無効になります。
ARGUMENT_TYPE_CHANGED: この引数に渡していた値が受け付けられなくなることがあります。
ARGUMENT_DEFAULT_VALUE_CHANGED: この引数を省略したときの動作が変わります。
INPUT_FIELD_ADDED: 省略可能な入力フィールドの追加は既存のリクエストに影響しません。
INPUT_FIELD_REMOVED: この入力フィールドを指定するリクエストが無効になります。
INPUT_FIELD_TYPE_CHANGED: この入力フィールドに渡していた値が受け付けられなくなることがあります。
INPUT_FIELD_DEFAULT_VALUE_CHANGED: この入力フィールドを省略したときの動作が変わります。
INPUT_OBJECT_ONE_OF_ADDED: null 以外の値を持つ入力フィールドをちょうど1つ指定する必要があります。
INPUT_OBJECT_ONE_OF_REMOVED: 複数の入力フィールドを指定したり、すべて省略したりできます。
ENUM_VALUE_ADDED: 応答に使う Enum に値が増えます。値ごとに分岐するコードで新しい値を扱う必要があります。
ENUM_VALUE_REMOVED: この Enum 値を入力に指定したり、応答から受け取ったりできなくなります。
UNION_MEMBER_ADDED: Union が新しい型の値を返します。具象型で分岐するコードで新しい型を扱う必要があります。
UNION_MEMBER_REMOVED: 削除したメンバーを型条件とする Fragment の展開が無効になることがあります。
DIRECTIVE_ADDED: 指令の追加は既存のリクエストに影響しません。
DIRECTIVE_REMOVED: この指令を使う Operation が無効になります。
DIRECTIVE_LOCATION_ADDED: この指令を使える位置が増えます。
DIRECTIVE_LOCATION_REMOVED: 削除した位置ではこの指令を使えなくなります。
DIRECTIVE_REPEATABLE_ADDED: 同じ位置でこの指令を繰り返し使えるようになります。
DIRECTIVE_REPEATABLE_REMOVED: 同じ位置でこの指令を繰り返し使う Operation が無効になります。
DIRECTIVE_ARGUMENT_ADDED: 省略可能な指令引数の追加は既存のリクエストに影響しません。
DIRECTIVE_ARGUMENT_REMOVED: この指令引数を指定する Operation が無効になります。
DIRECTIVE_ARGUMENT_TYPE_CHANGED: この指令引数に渡していた値が受け付けられなくなることがあります。
DIRECTIVE_ARGUMENT_DEFAULT_VALUE_CHANGED: この指令引数を省略したときの動作が変わります。
APPLIED_DIRECTIVE_ADDED: 指令が適用されました。実行時の動作が変わることがあります。
APPLIED_DIRECTIVE_REMOVED: 指令の適用が解除されました。実行時の動作が変わることがあります。
APPLIED_DIRECTIVE_ARGUMENT_CHANGED: 適用した指令の引数が変わり、実行時の動作が変わることがあります。
DESCRIPTION_CHANGED: 説明文の変更は既存のリクエストや応答に影響しません。
DEPRECATION_ADDED: 非推奨になりました。将来の削除に備えて利用箇所を移行してください。
DEPRECATION_REMOVED: 非推奨が解除されました。
DEPRECATION_REASON_CHANGED: 非推奨理由が変わりました。
output_narrowed: 戻り値の Non-Null の保証が強くなります。
output_weakened: Non-Null の保証がなくなります。応答を扱うコードを確認してください。
input_widened: 受け付ける値の範囲が広がります。
input_required: 省略できない入力が追加され、省略していたリクエストが無効になります。
input_default_removed: 既定値が削除され、入力を省略できなくなります。
enum_input_added: 入力できる Enum 値が増えます。
enum_input_removed: この Enum 値を指定するリクエストが無効になることがあります。
enum_output_removed: この Enum 値は応答に含まれなくなります。
unreachable: 変更前と変更後のどちらのルート型からも、この型には到達できません。
type_system_directive: この指令の変更は型システムの定義にだけ影響します。
closed_world_unreferenced: 宣言した利用者集合の中に参照は見つかりませんでした。
