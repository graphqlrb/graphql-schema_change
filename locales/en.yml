---
ROOT_OPERATION_TYPE_ADDED: A new operation kind is available.
ROOT_OPERATION_TYPE_REMOVED: Operations of this kind can no longer run.
ROOT_OPERATION_TYPE_CHANGED: The root type changed, which can affect selections, type conditions and __typename.
TYPE_ADDED: Adding a type preserves existing uses.
TYPE_REMOVED: Operations that reference this type can become invalid.
TYPE_KIND_CHANGED: A change in the kind of type can affect selections and the shape of values.
SCALAR_SPECIFIED_BY_CHANGED: The specification for the scalar's value format changed.
FIELD_ADDED: Adding a field preserves existing selections.
FIELD_REMOVED: Operations selecting this field can become invalid.
FIELD_TYPE_CHANGED: The return type changed, which can affect selections and the shape of values.
IMPLEMENTED_INTERFACE_ADDED: The interface can now return values of this type, affecting clients that branch on the concrete type.
IMPLEMENTED_INTERFACE_REMOVED: An interface no longer accepts this concrete type, which can invalidate fragment spreads and change responses.
ARGUMENT_ADDED: Adding an optional argument preserves existing requests.
ARGUMENT_REMOVED: Operations supplying this argument can become invalid.
ARGUMENT_TYPE_CHANGED: Values supplied for this argument may no longer be accepted.
ARGUMENT_DEFAULT_VALUE_CHANGED: Requests omitting this argument may behave differently.
INPUT_FIELD_ADDED: Adding an optional input field preserves existing requests.
INPUT_FIELD_REMOVED: Requests supplying this input field can become invalid.
INPUT_FIELD_TYPE_CHANGED: Values supplied for this input field may no longer be accepted.
INPUT_FIELD_DEFAULT_VALUE_CHANGED: Requests omitting this input field may behave differently.
INPUT_OBJECT_ONE_OF_ADDED: Exactly one non-null input field must now be supplied.
INPUT_OBJECT_ONE_OF_REMOVED: Requests can now supply multiple input fields or omit all of them.
ENUM_VALUE_ADDED: Clients handling every possible response value may need to handle the new enum value.
ENUM_VALUE_REMOVED: This enum value can no longer be submitted or returned.
UNION_MEMBER_ADDED: Clients branching on the concrete type may need to handle a new union member.
UNION_MEMBER_REMOVED: A fragment spread targeting the removed member can become invalid.
DIRECTIVE_ADDED: Adding a directive preserves existing requests.
DIRECTIVE_REMOVED: Operations using this directive can become invalid.
DIRECTIVE_LOCATION_ADDED: The directive is available in an additional location.
DIRECTIVE_LOCATION_REMOVED: This directive can no longer be used at this location.
DIRECTIVE_REPEATABLE_ADDED: The directive can now be used more than once in a location.
DIRECTIVE_REPEATABLE_REMOVED: Operations repeating this directive in a location can become invalid.
DIRECTIVE_ARGUMENT_ADDED: Adding an optional directive argument preserves existing requests.
DIRECTIVE_ARGUMENT_REMOVED: Operations supplying this directive argument can become invalid.
DIRECTIVE_ARGUMENT_TYPE_CHANGED: Values supplied for this directive argument may no longer be accepted.
DIRECTIVE_ARGUMENT_DEFAULT_VALUE_CHANGED: Operations omitting this directive argument may behave differently.
APPLIED_DIRECTIVE_ADDED: A directive application was added and may affect runtime behavior.
APPLIED_DIRECTIVE_REMOVED: A directive application was removed and may affect runtime behavior.
APPLIED_DIRECTIVE_ARGUMENT_CHANGED: An applied directive's arguments changed and may affect runtime behavior.
DESCRIPTION_CHANGED: Description changes preserve existing requests and responses.
DEPRECATION_ADDED: This element is deprecated. Migrate its existing uses before it is removed.
DEPRECATION_REMOVED: This element is no longer deprecated.
DEPRECATION_REASON_CHANGED: The deprecation reason changed.
output_narrowed: The return type now provides a stronger non-null guarantee.
output_weakened: A non-null guarantee was removed. Check code that consumes the response.
input_widened: The input type now accepts a wider range of values.
input_required: This additional required input invalidates requests that omit it.
input_default_removed: A default value was removed and the input became required.
enum_input_added: This enum accepts an additional input value.
enum_input_removed: Requests supplying this enum value can become invalid.
enum_output_removed: This enum value is no longer returned.
unreachable: The type cannot be reached from either schema's root operations.
type_system_directive: This directive change affects schema definitions only.
closed_world_unreferenced: No reference was found in the declared closed set of operations.
